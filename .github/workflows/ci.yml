# Fast checks on every push and pull request.
#
# Split by directory and path-filtered, so a change to the TypeScript server
# does not re-run the Go build and vice versa. Neither job needs a built index:
# the Go tests are self-contained, and the TypeScript suite skips the
# integration tests when there is no artifact, leaving the unit tests — folding,
# geometry, the k-d tree — which are the ones a code change is likely to break.
#
# Building a real index and running the full suite against it is the separate
# `pipeline` workflow, because it costs a download and several minutes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - 'ingest/**'
              - 'config/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              # The folding contract test lives on this side but breaks when the
              # Go normalizer moves, so a change there has to run it. Without
              # this, the one test whose job is catching Go/TypeScript drift is
              # skipped by exactly the commit that causes drift.
              - 'ingest/internal/norm/**'
              - '.github/workflows/ci.yml'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    env:
      # No cgo anywhere: the ingest binaries are static and need no C toolchain.
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: ingest/go.mod
          cache-dependency-path: ingest/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"; echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: ingest

      - name: test
        # The race detector needs cgo, while everything shipped is built without
        # it. Enabled for the test step only; the binaries stay static.
        run: go test -race -count=1 ./...
        env:
          CGO_ENABLED: '1'

      # The TypeScript side asserts against constants Go publishes. If the
      # committed fixture is stale, the contract test is checking history.
      - name: format-constant fixture is current
        run: |
          go run ./cmd/formatconsts -out /tmp/format-constants.json
          diff -u ../server/test/format-constants.json /tmp/format-constants.json \
            || { echo "::error::run 'make format-constants' and commit the result"; exit 1; }

      - name: build every command
        run: go build ./...

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The server and client consume @anchor-geocoder/core through its
      # published exports, so it has to exist before either typechecks.
      - name: build shared packages
        run: pnpm -r --filter "./packages/*" build

      - name: typecheck
        run: |
          pnpm -r --filter "./packages/*" exec tsc --noEmit -p tsconfig.json
          cd server && pnpm exec tsc --noEmit -p tsconfig.test.json

      - name: lint
        run: cd server && pnpm exec eslint .

      # The pool runs its threads from the compiled worker entry — a Worker gets
      # a fresh module loader and cannot read a .ts file — so without an emit
      # the one test that starts a real multi-threaded server skips.
      - name: build server
        run: cd server && pnpm build

      - name: test
        # Against the committed demo index. build/ is gitignored, so without
        # this the whole geocode suite skips and a green tick means only that it
        # compiles. Tests naming a specific country still skip; the rest — the
        # search bound, spelling correction, reverse, the HTTP endpoint — run.
        run: pnpm -r test
        env:
          INDEX_DIR: ${{ github.workspace }}/demo/index

      - name: build the server
        run: cd server && pnpm exec tsc -p tsconfig.json

      # The image is a deliverable and nothing else builds it, so a change to
      # the Node version or the dependency purge would otherwise only be found
      # by hand. Only the runtime target: `bundled` copies build/index, which a
      # runner does not have. Then boot it against the committed demo index and
      # make it answer, since an image that builds is not the same as one that
      # runs.
      - name: container builds and serves
        run: |
          docker build --target runtime -t anchor-geocoder:ci .
          docker run -d --name ci-check -p 3000:3000 \
            -v "$PWD/demo/index:/index:ro" anchor-geocoder:ci
          for i in $(seq 30); do
            curl -sf localhost:3000/health >/dev/null && break || sleep 1
          done
          curl -sf localhost:3000/health | grep -q '"status":"ok"'
          curl -sf 'localhost:3000/v1/geocode?q=Vaduz&limit=1' | grep -q Vaduz
          docker rm -f ci-check

      # A spec that does not match the code is worse than none, so it is
      # generated here and checked rather than committed.
      - name: OpenAPI document is well-formed
        run: |
          cd server && node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const s = readFileSync('src/server.ts','utf8');
            if (!s.includes('openapi:')) { console.error('no OpenAPI registration'); process.exit(1); }
          "

  # A single required check, so branch protection has one name to point at
  # however the path filters resolve.
  ci:
    if: always()
    needs: [go, server]
    runs-on: ubuntu-latest
    steps:
      - name: verify no job failed
        run: |
          echo "go=${{ needs.go.result }} server=${{ needs.server.result }}"
          [ "${{ contains(needs.*.result, 'failure') }}" = "false" ] || exit 1
          [ "${{ contains(needs.*.result, 'cancelled') }}" = "false" ] || exit 1
