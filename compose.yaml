# Local run of the slim image against an index built on the host.
#
# `make index` first; the artifact is mounted read-only rather than copied into
# the image, so rebuilding the index does not mean rebuilding the image.
services:
  geocode:
    build:
      context: .
      target: runtime
    image: anchor-geocoder:slim
    ports:
      - "3000:3000"
    volumes:
      - ./build/index:/index:ro
    environment:
      INDEX_DIR: /index
      HOST: 0.0.0.0
      PORT: "3000"
    # The process holds the whole index in typed arrays, plus a k-d tree over
    # every address point. Across the fourteen indexed countries that is a few
    # GB resident; the k-d tree alone is ~730 MB for 61M points. Too low a limit
    # is OOM-killed mid-boot, while the tree is being built.
    mem_limit: 4g
    restart: unless-stopped
