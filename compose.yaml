# Local run of the slim image against an index built on the host.
#
# `make index` first; the artifact is mounted read-only rather than copied into
# the image, so rebuilding the index does not mean rebuilding the image.
services:
  geocode:
    build:
      context: .
      target: runtime
    image: anchor-geocoder:slim
    ports:
      - "3000:3000"
    volumes:
      - ./build/index:/index:ro
    environment:
      INDEX_DIR: /index
      HOST: 0.0.0.0
      PORT: "3000"
      # One request thread per core the container is given, which is what
      # `cpus` below sets. Uncomment to pin it.
      # WORKERS: "4"
    # Sized off the index rather than guessed: the artifact is held as typed
    # arrays, so resident memory starts at its size on disk — 4.4 GB for the 42
    # countries — and each request thread adds ~70 MB of decoded strings and
    # folded tokens on top. Threads share the index itself, so the count barely
    # moves this number. Too low a limit is an OOM kill during the first read.
    mem_limit: 8g
    # Throughput is very nearly linear in this, and nothing else the service
    # does is a bottleneck before it.
    cpus: 4
    restart: unless-stopped
