# Local run of the slim image against an index built on the host.
#
# `make index` first; the artifact is mounted read-only rather than copied into
# the image, so rebuilding the index does not mean rebuilding the image.
services:
  geocode:
    build:
      context: .
      target: runtime
    image: anchor-geocoder:slim
    ports:
      - "3000:3000"
    volumes:
      - ./build/index:/index:ro
    environment:
      INDEX_DIR: /index
      HOST: 0.0.0.0
      PORT: "3000"
      # One request thread per core the container is given, which is what
      # `cpus` below sets. Uncomment to pin it.
      # WORKERS: "4"
    # Sized off the index plus the pool, not guessed. The artifact is held as
    # typed arrays shared by every thread, so resident memory starts at its size
    # on disk — 4.4 GB for the 42 countries — and each request thread adds ~68 MB
    # idle and up to ~290 MB while it is actually serving, nearly all of it V8
    # heap for in-flight responses. At the four threads below that is ~5.6 GB
    # under load; raise both together. Too low a limit is an OOM kill, either
    # during the first read or later under traffic.
    mem_limit: 8g
    # Throughput is very nearly linear in this, and nothing else the service
    # does is a bottleneck before it.
    cpus: 4
    restart: unless-stopped
